name: CI — GPS Control

on:
  push:
    branches: [main, feat-*, fix-*]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Backend: lint + tests + security audit
  # ============================================================
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: ci-test-secret-key-32-chars-long!
          WIALON_BASE_URL: https://hst-api.wialon.com
          WIALON_TOKEN: fake-token-for-ci
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: TestAdmin1234!
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        continue-on-error: true

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2024-45 || true

  # ============================================================
  # Frontend: lint + build
  # ============================================================
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: https://api.gpscontrol.example.com/api/v1
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high || true

  # ============================================================
  # Docker build smoke test
  # ============================================================
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t gpscontrol-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t gpscontrol-frontend:ci .

